<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb" id="meta-theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>mooncheck — Absensi</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">

    <!-- ===== layar penuh: setup pertama / login / kunci ===== -->
    <div id="screen-auth" class="auth-wrap" hidden>
      <div class="auth-card" id="auth-card"><!-- diisi ui.js --></div>
      <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <path d="M30 6a18 18 0 1 0 12 31.5A21 21 0 0 1 30 6z" fill="currentColor" opacity=".9"/>
            <circle cx="34" cy="14" r="2.6" fill="currentColor" opacity=".55"/>
          </svg>
        </div>
        <div class="auth-brand-name">mooncheck</div>
        <div class="auth-brand-sub">Absensi admin &amp; anggota — satu aplikasi</div>
      </div>
    </div>

    <!-- ===== shell aplikasi ===== -->
    <div id="shell" hidden>
      <header id="topbar">
        <button class="icon-btn" id="btn-profile" aria-label="Profil">
          <span id="avatar" class="avatar">?</span>
        </button>
        <div class="topbar-title">
          <div id="top-title">mooncheck</div>
          <div id="top-sub" class="topbar-sub"></div>
        </div>
        <button class="icon-btn" id="btn-lock" aria-label="Kunci sekarang">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>
        </button>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav id="bottomnav" class="bottomnav" aria-label="Navigasi utama"></nav>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <!-- urutan modul inti -->
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/vendor/jsQR.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/qrlib.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/ui.js"></script>
  <!-- bootstrap dulu (MC.app.route tersedia saat halaman memuat;
       boot() sendiri tertunda sampai DOMContentLoaded) -->
  <script src="js/app.js"></script>
  <!-- halaman -->
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/qr.js"></script>
  <script src="js/pages/scan.js"></script>
  <script src="js/pages/members.js"></script>
  <script src="js/pages/rekap.js"></script>
  <script src="js/pages/leaves.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
